[project]
name = "nso-learning"
version = "0.1.0"
description = "Local masked PPO trainer for NSO offline AI players"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.9.1",
  "stable-baselines3==2.7.1",
  "sb3-contrib==2.7.1",
  "gymnasium==1.2.2",
  "numpy==2.2.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
