[project]
name = "nso-brain"
version = "0.1.0"
description = "Local LLM and RAG service for NSO offline players"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
